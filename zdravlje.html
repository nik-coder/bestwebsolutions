<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>Dr. Axe - Srpski Članci</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; max-width: 800px; margin: auto; }
    article { background: white; padding: 20px; margin: 20px 0; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
    .loading { text-align: center; font-size: 18px; }
  </style>
</head>
<body>
  <h1>📰 Dr. Axe - Tekući mesec (prevod na srpski)</h1>
  <div id="content"><div class="loading">Učitavanje članaka...</div></div>

  <script>
    const endpoint = "https://api.rss2json.com/v1/api.json?rss_url=https://draxe.com/feed/?post_type=recipe";
    const today = new Date();
    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

    async function translateText(text) {
      try {
        const res = await fetch("https://libretranslate.de/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ q: text, source: "en", target: "sr", format: "text" })
        });
        const data = await res.json();
        return data.translatedText || text;
      } catch (err) {
        return text; // fallback to original if translation fails
      }
    }

    async function loadArticles() {
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = "";

      const res = await fetch(endpoint);
      const data = await res.json();

      let shown = 0;
      for (const item of data.items) {
        const pubDate = new Date(item.pubDate);
        if (pubDate < firstDay || pubDate > lastDay) continue;

        const translatedTitle = await translateText(item.title);
        const translatedBody = await translateText(item.contentSnippet);

        const article = document.createElement("article");
        article.innerHTML = `
          <h2>${translatedTitle}</h2>
          <img src="${item.thumbnail || ''}" alt="slika">
          <p>${translatedBody}</p>
          <a href="${item.link}" target="_blank">Pročitaj više →</a>
        `;
        contentEl.appendChild(article);
        shown++;
      }

      if (shown === 0) {
        contentEl.innerHTML = "<p>Za tekući mesec nema dostupnih članaka.</p>";
      }
    }

    loadArticles();
  </script>
</body>
</html>
