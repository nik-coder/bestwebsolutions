<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Dr. Axe - Prevedeni članci</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; max-width: 800px; margin: auto; }
    article { background: white; padding: 20px; margin: 20px 0; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>📰 Dr. Axe – Tekući mesec (prevedeno)</h1>
  <div id="content">Učitavanje članaka...</div>

  <script>
    fetch('/api/feed')
      .then(res => res.text())
      .then(html => {
        document.getElementById('content').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('content').innerHTML = 'Greška pri učitavanju.';
        console.error(err);
      });
  </script>
</body>
</html>
